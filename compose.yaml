name: payment-processor

x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
    API_KEY: ${API_KEY:?Create .env using scripts/create_env.py}
    RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/openapi.json', headers={'X-API-Key': os.environ['API_KEY']}), timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  consumer:
    <<: *app
    command: [faststream, run, app.consumer:app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  webhook:
    <<: *app
    profiles: [demo]
    command: [uvicorn, demo.webhook:app, --host, "0.0.0.0", --port, "8001"]
    volumes:
      - ./demo:/app/demo:ro
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-18081}:8001"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/events/readiness', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
